<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lieferoo — Address details</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./user.css" />
</head>
<body>
  <div class="app-frame">
    <!-- Top Bar -->
    <header class="top-bar">
      <button type="button" class="back-btn" onclick="history.back()" aria-label="Go back">&#8592;</button>
      <h1 class="top-bar-title">Address details</h1>
    </header>

    <!-- Server Error Top Banner -->
    <div id="serverBanner" class="server-banner" role="alert"></div>

    <!-- Map / Location Pin Block (#E8E8E8 with primary-pressed pin icon) -->
    <div class="location-banner" aria-hidden="true">
      <svg class="location-pin-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
      </svg>
    </div>

    <main class="content">
      <!-- Address Picker -->
      <div class="section-group">
        <label for="addressPicker" class="section-label">Select address</label>
        <select id="addressPicker" class="picker-select"></select>
      </div>

      <!-- Address Card -->
      <section class="address-card" aria-label="Selected address">
        <div id="cardTitle" class="address-title"></div>
        <div id="cardSub" class="address-sub"></div>
      </section>

      <!-- Building and Unit -->
      <div class="section-group">
        <div class="section-label">Where exactly?</div>
        <label for="buildingUnit" class="helper-text" style="font-weight: 600; color: var(--text);">Building and unit *</label>
        <input
          type="text"
          id="buildingUnit"
          class="input-field"
          placeholder="e.g. 101동 1203호"
          maxlength="50"
          autocomplete="off"
        />
        <p id="buildingError" class="error-text"></p>
        <p class="helper-text">Write it like the example. Riders read it in Korean.</p>
      </div>

      <!-- Entry Method (4 Radio Cards) -->
      <div class="section-group">
        <div class="section-label">How does the rider get in? *</div>
        <div id="radioGrid" class="radio-grid" role="radiogroup" aria-label="How does the rider get in?">
          <label class="radio-card" data-value="door_code">
            <input type="radio" name="entryMethod" value="door_code" />
            <div>
              <div class="radio-card-title">Door code</div>
              <div class="radio-card-desc">Rider enters a code at the building door</div>
            </div>
          </label>

          <label class="radio-card" data-value="call">
            <input type="radio" name="entryMethod" value="call" />
            <div>
              <div class="radio-card-title">Intercom</div>
              <div class="radio-card-desc">Rider rings your unit at the entrance</div>
            </div>
          </label>

          <label class="radio-card" data-value="security_desk">
            <input type="radio" name="entryMethod" value="security_desk" />
            <div>
              <div class="radio-card-title">Security desk</div>
              <div class="radio-card-desc">Security staff let the rider in</div>
            </div>
          </label>

          <label class="radio-card" data-value="free">
            <input type="radio" name="entryMethod" value="free" />
            <div>
              <div class="radio-card-title">No code needed</div>
              <div class="radio-card-desc">No gate or door code</div>
            </div>
          </label>
        </div>
        <p id="entryError" class="error-text"></p>

        <!-- Door Code Input (Visible only when Door code is selected) -->
        <div id="doorCodeBox" class="door-code-box">
          <label for="doorCodeInput" class="helper-text" style="font-weight: 600; color: var(--text);">Door code *</label>
          <input
            type="text"
            id="doorCodeInput"
            class="input-field"
            placeholder="e.g. 4826#"
            autocomplete="off"
          />
          <p id="doorCodeError" class="error-text"></p>
        </div>
      </div>

      <!-- Use this next time Checkbox -->
      <label class="save-default-row" for="useNextTime">
        <input type="checkbox" id="useNextTime" class="save-default-checkbox" />
        <div>
          <div class="save-default-title">Use this next time</div>
          <div class="save-default-sub">Saved with the address. You can change it anytime.</div>
        </div>
      </label>

      <!-- Note for Rider -->
      <div class="section-group">
        <label for="riderNote" class="section-label">Note for rider (optional)</label>
        <p class="helper-text">Door code goes above.</p>
        <textarea
          id="riderNote"
          class="textarea-field"
          placeholder="e.g. Turn left at the elevator."
          maxlength="200"
        ></textarea>
        <div id="charCounter" class="char-counter">0/200</div>
      </div>

      <!-- Rider Preview -->
      <div class="section-group">
        <div class="section-label">Your rider will see</div>
        <div id="previewContainer"></div>
      </div>

      <!-- Save Confirmation -->
      <div id="successBox" class="success-box" role="status"></div>
    </main>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
      <button type="button" id="saveBtn" class="btn-big" disabled>Save address</button>
    </div>
  </div>

  <script src="./user.js"></script>
</body>
</html>
